name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        shell: powershell
        working-directory: .

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Login to Azure using OIDC
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # 3. Verify Azure Login
      # --------------------------------------------------
      - name: Check Azure Account
        run: |
          Write-Host "======================================"
          Write-Host "        AZURE ACCOUNT INFORMATION"
          Write-Host "======================================"

          az account show --output table

      # --------------------------------------------------
      # 4. Check Terraform Installation
      # --------------------------------------------------
      - name: Check Terraform
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM INFORMATION"
          Write-Host "======================================"

          Write-Host "`nTerraform Location:"
          where.exe terraform

          Write-Host "`nTerraform Version:"
          terraform version

      # --------------------------------------------------
      # 5. Check Terraform Files
      # --------------------------------------------------
      - name: Check Terraform Files
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM FILES"
          Write-Host "======================================"

          Write-Host "`nCurrent Directory:"
          Get-Location

          Write-Host "`nTerraform Files:"
          Get-ChildItem -Path . -Filter *.tf

      # --------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM INIT"
          Write-Host "======================================"

          terraform init

      # --------------------------------------------------
      # 7. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM VALIDATE"
          Write-Host "======================================"

          terraform validate

      # --------------------------------------------------
      # 8. Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM PLAN"
          Write-Host "======================================"

          terraform plan -no-color

      # --------------------------------------------------
      # 9. Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        run: |
          Write-Host "======================================"
          Write-Host "        TERRAFORM APPLY"
          Write-Host "======================================"

          terraform apply -auto-approve
```
