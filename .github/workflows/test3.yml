name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Deployment
    runs-on:
      - self-hosted
      - windows
      - x64

    defaults:
      run:
        shell: powershell
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Account
        run: |
          Write-Host "AZURE ACCOUNT"
          az account show --output table

      - name: Check Terraform
        run: |
          Write-Host "TERRAFORM PATH"
          where.exe terraform
          Write-Host "TERRAFORM VERSION"
          terraform version

      - name: Check Terraform Files
        run: |
          Write-Host "CURRENT DIRECTORY"
          Get-Location
          Write-Host "TERRAFORM FILES"
          Get-ChildItem -Path . -Filter *.tf

      - name: Terraform Init
        run: |
          Write-Host "TERRAFORM INIT"
          terraform init

      - name: Terraform Validate
        run: |
          Write-Host "TERRAFORM VALIDATE"
          terraform validate

      - name: Terraform Plan
        run: |
          Write-Host "TERRAFORM PLAN"
          terraform plan -no-color

      - name: Terraform Apply
        run: |
          Write-Host "TERRAFORM APPLY"
          terraform apply -auto-approve
